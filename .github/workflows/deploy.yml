name: Deploy to GitHub Pages

# Apollo is plain static HTML. The job stages just the files that make up the
# site into _site/ and publishes that, so the README, the dev server and the
# credit source data stay in the repo but off the web.
#
# The staged copy is then minified in place. Nothing in the repo is touched —
# `python3 serve.py` still runs the readable source. What ships is stripped of
# every comment and newline, so view-source gives a copyist the rendering but
# not the reasoning: no notes on why a curve is what it is, no dead code, no
# named intent. It is friction, not protection — the CSS and the DOM are still
# fully readable to anyone who wants them.
#
# The site is served from a subpath of the custom domain:
# https://umutcanceyhan.com/apollo/ — every path in the markup is relative, so
# nothing needs a base rewrite.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs of the same ref.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage site
        run: |
          mkdir -p _site
          cp *.html _site/
          cp -R assets _site/

          # The behind-the-scenes originals are camera files — up to 5120px,
          # ~150 MB, delivered over WhatsApp. tools/backstage-prep.mjs writes
          # the web sizes into assets/backstage/web/ and parks the originals
          # in _src/; only the derivatives belong on the web. Dropping them
          # here rather than in .gitignore keeps the masters in the repo,
          # which is where the studio's own copy of them lives.
          rm -rf _site/assets/backstage/_src
          find _site/assets/backstage -maxdepth 1 -type f \
               \( -name '*.mp4' -o -name '*.jpeg' -o -name '*.jpg' \) -delete

          echo "--- staged ---"
          du -sh _site
          du -sh _site/assets/backstage _site/assets/films
          find _site -maxdepth 2 -type d

      # esbuild minifies each file on its own — no bundling. films.js hands the
      # catalogue to app.js over `window.APOLLO_FILMS`, and window properties
      # survive mangling, so the two files stay independent scripts loaded in
      # order, exactly as the markup expects.
      - name: Minify CSS and JS
        run: |
          npx --yes esbuild@0.25.0 _site/assets/js/*.js \
            --minify --legal-comments=none \
            --outdir=_site/assets/js --allow-overwrite --log-level=warning
          npx --yes esbuild@0.25.0 _site/assets/css/*.css \
            --minify --legal-comments=none \
            --outdir=_site/assets/css --allow-overwrite --log-level=warning

      # Collapses the markup and strips comments. The pages carry no <style>
      # blocks and one two-line inline script; minify-js/css cover those.
      - name: Minify HTML
        run: |
          npx --yes html-minifier-terser@7.2.0 \
            --input-dir _site --output-dir _site --file-ext html \
            --collapse-whitespace --remove-comments \
            --remove-redundant-attributes \
            --minify-js true --minify-css true
          echo "--- minified ---"
          du -sh _site/assets/css _site/assets/js
          ls -l _site/*.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
