<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Film — Apollo Films</title>
<link rel="preconnect" href="https://images.squarespace-cdn.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400&display=swap">
<link rel="stylesheet" href="assets/css/apollo.css">
<meta name="theme-color" content="#060603">
<!-- Set before first paint. The entrances in apollo.css only hide their
     elements under `.js`, so a page without script stays fully readable —
     and the mode is restored in the same breath, because read any later it
     shows as a whole-page flash from the projection room to the contact
     sheet. Dark is the site's default, so it is the absence of the
     attribute and only light is ever written. -->
<script>(function(d){d.className+=' js';try{if(localStorage.getItem('apollo-theme')==='light'){d.setAttribute('data-theme','light');var m=document.querySelector('meta[name=theme-color]');if(m)m.content='#f2f0e6';}}catch(e){}})(document.documentElement);</script>
</head>
<body>

<a class="sr-only" href="#main">Skip to content</a>

<header class="masthead">
  <a class="masthead__brand" href="index.html"><span class="sr-only">Apollo Films</span></a>
  <div class="masthead__end">
    <button class="masthead__toggle" type="button" aria-expanded="false" aria-controls="nav">Menu</button>
    <nav class="masthead__nav" id="nav">
      <a href="showcase.html" aria-current="page">Showcase</a>
      <a href="about.html">About</a>
      <a href="backstage.html">Backstage</a>
      <a href="contact.html">Contact</a>
    </nav>
    <!-- Half the disc inked, half left as hairline: the two grounds, shown
         together. app.js only flips the mode; the half turn is CSS. -->
    <button class="themeswitch" type="button" data-theme-toggle
            aria-label="Switch to light mode" title="Switch to light mode">
      <svg class="themeswitch__i" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
        <g class="themeswitch__disc">
          <circle class="themeswitch__ring" cx="10" cy="10" r="7.5"/>
          <path class="themeswitch__half" d="M10 2.5 A7.5 7.5 0 0 0 10 17.5 Z"/>
        </g>
      </svg>
    </button>
  </div>
</header>

<main id="main">
  <div id="film">

    <section class="band band--dark band--flush" style="padding-top:0;padding-bottom:0;">
      <!-- The film starts itself, silent and looping, the way it does on
           every other stage on the site. Controls would put a scrub bar over
           the frame; the only thing to decide here is the sound. -->
      <div class="filmstage">
        <video class="player" data-player playsinline muted loop preload="metadata"></video>
        <button class="soundbtn" type="button" data-sound aria-pressed="false"
                aria-label="Turn sound on" title="Turn sound on">
          <svg class="soundbtn__i" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
            <path class="soundbtn__cone" d="M4 7.5h3l4-3v11l-4-3H4z"/>
            <path class="soundbtn__wave" d="M13.4 7.2a4 4 0 0 1 0 5.6"/>
            <path class="soundbtn__wave soundbtn__wave--far" d="M15.6 5a7 7 0 0 1 0 10"/>
            <path class="soundbtn__slash" d="M13.5 7.5l4 5"/>
          </svg>
        </button>
      </div>
    </section>

    <section class="band band--dark">
      <div class="stack stack--xl">

        <div class="stack stack--sm">
          <span class="label dim" data-cat data-reveal></span>
          <h1 class="display" data-title data-split data-reveal="60"></h1>
          <span class="fine dim" data-client data-reveal="160"></span>
          <span class="label dim year" data-made data-reveal="200"></span>
        </div>

        <div class="columns columns--sticky" data-cast-block data-reveal hidden>
          <p class="label dim">Cast</p>
          <ol class="credits" data-cast></ol>
        </div>

        <div class="columns columns--sticky" data-crew-block data-reveal hidden>
          <p class="label dim">Crew</p>
          <ol class="credits" data-credits></ol>
        </div>

        <div class="columns columns--sticky" data-also-block data-reveal hidden>
          <p class="label dim">Also credited</p>
          <p class="namelist" data-also></p>
        </div>

        <!-- Key art, where the catalogue holds any for this film. Hidden
             until app.js finds posters against the slug, so a film without
             them prints no empty heading. It sits directly above the two
             films either side of it, so the art and the way out share a
             stretch of page. -->
        <div class="columns columns--sticky" data-poster-block data-reveal hidden>
          <p class="label dim">Key art</p>
          <div class="posters" data-posters></div>
        </div>

        <div class="filmnav" data-reveal>
          <a data-prev href="#">
            <span class="filmnav__art" data-prev-art hidden></span>
            <span class="label dim">Previous</span>
            <span class="t"></span>
          </a>
          <a data-next href="#">
            <span class="filmnav__art" data-next-art hidden></span>
            <span class="label dim">Next</span>
            <span class="t"></span>
          </a>
        </div>

      </div>
    </section>

  </div>

  <!-- Key art at size. One frame on a black ground, because a poster was
       drawn to be looked at whole and a strip of thumbnails is only an
       index of them. Empty until a poster is opened. -->
  <div class="lightbox" data-lightbox hidden role="dialog" aria-modal="true" aria-label="Key art">
    <button class="lightbox__close" type="button" data-lightbox-close aria-label="Close">Close</button>
    <figure class="lightbox__frame">
      <img class="lightbox__art" data-lightbox-art alt="">
      <figcaption class="fine dim" data-lightbox-at></figcaption>
    </figure>
  </div>

  <section class="band band--cream">
    <div class="stack stack--lg">
      <h2 class="display" data-split data-reveal>More work.</h2>
      <a class="btn" href="showcase.html">Back to showcase</a>
    </div>
  </section>
</main>

<footer class="sitefooter">
  <div class="sitefooter__bar">
    <a class="label" href="mailto:info@apollofilms.co">info@apollofilms.co</a>
    <nav class="sitefooter__nav" aria-label="Footer">
      <a href="about.html">About</a>
      <a href="backstage.html">Backstage</a>
      <a href="contact.html">Contact</a>
      <a href="https://www.instagram.com/apollofilmsco/" target="_blank" rel="noopener">Instagram</a>
    </nav>
    <span class="label">Istanbul, Turkey</span>
    <span class="label">© <span data-year>2026</span> Apollo Films</span>
  </div>
</footer>

<script src="assets/js/films.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
