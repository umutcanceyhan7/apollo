<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Showcase — Apollo Films</title>
<meta name="description" content="The complete Apollo Films archive, filtered by category — brand works, short films and trailers.">
<link rel="preconnect" href="https://images.squarespace-cdn.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400&display=swap">
<link rel="stylesheet" href="assets/css/apollo.css">
<meta name="theme-color" content="#060603">
<!-- Set before first paint. The entrances in apollo.css only hide their
     elements under `.js`, so a page without script stays fully readable —
     and the mode is restored in the same breath, because read any later it
     shows as a whole-page flash from the projection room to the contact
     sheet. Dark is the site's default, so it is the absence of the
     attribute and only light is ever written. -->
<script>(function(d){d.className+=' js';try{if(localStorage.getItem('apollo-theme')==='light'){d.setAttribute('data-theme','light');var m=document.querySelector('meta[name=theme-color]');if(m)m.content='#f2f0e6';}}catch(e){}})(document.documentElement);</script>
</head>
<body>

<a class="sr-only" href="#main">Skip to content</a>

<header class="masthead">
  <a class="masthead__brand" href="index.html"><span class="sr-only">Apollo Films</span></a>
  <div class="masthead__end">
    <button class="masthead__toggle" type="button" aria-expanded="false" aria-controls="nav">Menu</button>
    <nav class="masthead__nav" id="nav">
      <a href="showcase.html" aria-current="page">Showcase</a>
      <a href="about.html">About</a>
      <a href="backstage.html">Backstage</a>
      <a href="contact.html">Contact</a>
    </nav>
    <!-- Half the disc inked, half left as hairline: the two grounds, shown
         together. app.js only flips the mode; the half turn is CSS. -->
    <button class="themeswitch" type="button" data-theme-toggle
            aria-label="Switch to light mode" title="Switch to light mode">
      <svg class="themeswitch__i" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
        <g class="themeswitch__disc">
          <circle class="themeswitch__ring" cx="10" cy="10" r="7.5"/>
          <path class="themeswitch__half" d="M10 2.5 A7.5 7.5 0 0 0 10 17.5 Z"/>
        </g>
      </svg>
    </button>
  </div>
</header>

<main id="main">

  <section class="band band--dark">
    <div class="stack stack--lg">
      <h1 class="display" data-split data-reveal>This is where our work lives.</h1>
    </div>
  </section>

  <section class="band band--dark catalogue__filters">
    <div class="filters" data-reveal role="group" aria-label="Filter films by category">
      <button type="button" data-filter="All" aria-pressed="true">All</button>
      <button type="button" data-filter="Trailers" aria-pressed="false">Trailers</button>
      <button type="button" data-filter="Brand Works" aria-pressed="false">Brand Works</button>
      <button type="button" data-filter="Short Films" aria-pressed="false">Short Films</button>
    </div>
  </section>

  <section class="catalogue">
    <div class="catalogue__stage" id="catalogue-stage" aria-hidden="true"></div>
    <ol class="catalogue__list" id="catalogue-list"></ol>
  </section>

  <section class="band band--cream">
    <div class="stack stack--lg">
      <h2 class="display" data-split data-reveal>Bring us the brief.</h2>
      <a class="btn" href="contact.html">Contact the studio</a>
    </div>
  </section>

</main>

<footer class="sitefooter">
  <div class="sitefooter__bar">
    <a class="label" href="mailto:info@apollofilms.co">info@apollofilms.co</a>
    <nav class="sitefooter__nav" aria-label="Footer">
      <a href="about.html">About</a>
      <a href="backstage.html">Backstage</a>
      <a href="contact.html">Contact</a>
      <a href="https://www.instagram.com/apollofilmsco/" target="_blank" rel="noopener">Instagram</a>
    </nav>
    <span class="label">Istanbul, Turkey</span>
    <span class="label">© <span data-year>2026</span> Apollo Films</span>
  </div>
</footer>

<script src="assets/js/films.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
